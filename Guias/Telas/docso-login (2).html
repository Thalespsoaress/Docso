<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docso — Entrar</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --preto: #0A0A0A;
    --branco: #FAFAFA;
    --cinza-sup: #F0F0F0;
    --cinza-borda: #E4E4E4;
    --cinza-texto: #A0A0A0;
    --azul: #30BCFE;
    --vermelho: #FE7451;
    --amarelo: #FADB02;
    --verde: #39BD3D;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--preto);
    font-family: 'DM Sans', sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
  }

  /* ── LADO ESQUERDO — painel da marca ── */
  .left {
    width: 52%;
    background: var(--preto);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 56px 64px;
    position: relative;
    overflow: hidden;
  }

  /* linhas de fluxo decorativas */
  .flow-lines {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .fl {
    position: absolute;
    border-radius: 2px;
  }

  .fl-1 { width: 3px; height: 55%; background: var(--azul); left: 18%; top: -10%; opacity: 0.5; animation: pulse 4s ease-in-out infinite alternate; }
  .fl-2 { width: 3px; height: 35%; background: var(--verde); left: 38%; top: 15%; opacity: 0.3; animation: pulse 5s 1s ease-in-out infinite alternate; }
  .fl-3 { width: 3px; height: 45%; background: var(--vermelho); left: 58%; top: 5%; opacity: 0.2; animation: pulse 3.5s 0.5s ease-in-out infinite alternate; }
  .fl-4 { width: 3px; height: 25%; background: var(--amarelo); left: 76%; top: 25%; opacity: 0.25; animation: pulse 4.5s 1.5s ease-in-out infinite alternate; }

  /* trilho horizontal */
  .fl-h1 { height: 3px; width: 40%; background: var(--azul); left: 18%; top: 45%; opacity: 0.15; border-radius: 0; }
  .fl-h2 { height: 3px; width: 25%; background: var(--verde); left: 38%; top: 50%; opacity: 0.12; border-radius: 0; }

  @keyframes pulse {
    from { opacity: 0.15; transform: translateY(-8px); }
    to { opacity: 0.5; transform: translateY(8px); }
  }

  .left-top {}

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: -1px;
    color: var(--branco);
    text-decoration: none;
    display: inline-block;
  }

  .logo span { color: var(--azul); }

  .left-middle {
    animation: fadeUp 0.9s 0.1s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .left-headline {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: clamp(36px, 3.2vw, 52px);
    letter-spacing: -2px;
    line-height: 1.05;
    color: var(--branco);
    margin-bottom: 32px;
  }

  .left-headline .accent { color: var(--azul); }

  .left-sub {
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    font-size: 15px;
    color: var(--cinza-texto);
    line-height: 1.7;
    max-width: 380px;
  }

  /* mini fluxo demo */
  .left-bottom {
    animation: fadeUp 0.9s 0.3s ease both;
  }

  .mini-fluxo {
    background: #111;
    border: 1px solid #1e1e1e;
    border-radius: 10px;
    padding: 24px 28px;
    max-width: 420px;
  }

  .mf-label {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #333;
    margin-bottom: 20px;
  }

  .mf-etapas {
    display: flex;
    gap: 0;
  }

  .mf-etapa { flex: 1; padding-right: 12px; }

  .mf-linha {
    height: 3px;
    border-radius: 2px;
    margin-bottom: 10px;
  }

  .mf-nome {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    color: #555;
    line-height: 1.4;
    margin-bottom: 6px;
  }

  .mf-status {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* ── LADO DIREITO — formulário ── */
  .right {
    width: 48%;
    background: var(--branco);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 64px 72px;
    position: relative;
  }

  .right-inner {
    width: 100%;
    max-width: 400px;
    animation: fadeUp 0.8s 0.2s ease both;
  }

  .form-eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--cinza-texto);
    margin-bottom: 32px;
  }

  .form-titulo {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 36px;
    letter-spacing: -1.5px;
    color: var(--preto);
    margin-bottom: 8px;
    line-height: 1.05;
  }

  .form-sub {
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    font-size: 14px;
    color: var(--cinza-texto);
    margin-bottom: 48px;
  }

  .form-sub a {
    color: var(--preto);
    font-weight: 500;
    text-decoration: none;
    border-bottom: 1px solid var(--cinza-borda);
    transition: border-color 0.2s;
  }

  .form-sub a:hover { border-color: var(--preto); }

  /* campos */
  .campo {
    margin-bottom: 20px;
  }

  .campo label {
    display: block;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--preto);
    margin-bottom: 10px;
  }

  .campo input {
    width: 100%;
    height: 52px;
    background: var(--cinza-sup);
    border: 1.5px solid transparent;
    border-radius: 8px;
    padding: 0 18px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    font-size: 14px;
    color: var(--preto);
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }

  .campo input::placeholder {
    color: #C0C0C0;
  }

  .campo input:focus {
    background: var(--branco);
    border-color: var(--azul);
  }

  /* senha com toggle */
  .senha-wrap {
    position: relative;
  }

  .senha-wrap input {
    padding-right: 52px;
  }

  .senha-toggle {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: var(--cinza-texto);
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: color 0.2s;
  }

  .senha-toggle:hover { color: var(--preto); }

  /* opções */
  .form-opcoes {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
    margin-top: 4px;
  }

  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }

  .checkbox-label input[type="checkbox"] {
    display: none;
  }

  .checkbox-custom {
    width: 18px;
    height: 18px;
    background: var(--cinza-sup);
    border: 1.5px solid var(--cinza-borda);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, border-color 0.2s;
    flex-shrink: 0;
  }

  .checkbox-label input:checked + .checkbox-custom {
    background: var(--preto);
    border-color: var(--preto);
  }

  .checkbox-label input:checked + .checkbox-custom::after {
    content: '';
    width: 5px;
    height: 8px;
    border: 1.5px solid var(--branco);
    border-top: none;
    border-left: none;
    transform: rotate(45deg) translateY(-1px);
    display: block;
  }

  .checkbox-texto {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: #666;
    user-select: none;
  }

  .esqueci {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--cinza-texto);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: color 0.2s, border-color 0.2s;
  }

  .esqueci:hover {
    color: var(--preto);
    border-color: var(--cinza-borda);
  }

  /* botão */
  .btn-entrar {
    width: 100%;
    height: 52px;
    background: var(--preto);
    color: var(--branco);
    border: none;
    border-radius: 8px;
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: -0.3px;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    position: relative;
    overflow: hidden;
    margin-bottom: 20px;
  }

  .btn-entrar::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 40%, rgba(48,188,254,0.15) 100%);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .btn-entrar:hover {
    background: #1a1a1a;
    transform: translateY(-1px);
  }

  .btn-entrar:hover::after { opacity: 1; }
  .btn-entrar:active { transform: translateY(0); }

  /* divisor */
  .divisor {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
  }

  .divisor-linha {
    flex: 1;
    height: 1px;
    background: var(--cinza-borda);
  }

  .divisor-texto {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--cinza-texto);
  }

  /* SSO */
  .btn-sso {
    width: 100%;
    height: 52px;
    background: var(--branco);
    color: var(--preto);
    border: 1.5px solid var(--cinza-borda);
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: border-color 0.2s, background 0.2s;
  }

  .btn-sso:hover {
    border-color: var(--preto);
    background: var(--cinza-sup);
  }

  .sso-icon {
    width: 18px;
    height: 18px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px;
  }

  .sso-dot {
    border-radius: 1px;
  }

  /* rodapé do form */
  .form-footer {
    margin-top: 40px;
    padding-top: 24px;
    border-top: 1px solid var(--cinza-borda);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .form-footer-texto {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 1px;
    color: #D0D0D0;
  }

  .status-dot {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 1px;
    color: var(--verde);
  }

  .sd {
    width: 6px;
    height: 6px;
    background: var(--verde);
    border-radius: 50%;
    animation: blink 2s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* divisor vertical entre os dois painéis */
  .divider {
    width: 1px;
    background: #1a1a1a;
    position: absolute;
    left: 52%;
    top: 0;
    bottom: 0;
  }
</style>
</head>
<body>

<!-- PAINEL ESQUERDO -->
<div class="left">
  <div class="flow-lines">
    <div class="fl fl-1"></div>
    <div class="fl fl-2"></div>
    <div class="fl fl-3"></div>
    <div class="fl fl-4"></div>
    <div class="fl fl-h1"></div>
    <div class="fl fl-h2"></div>
  </div>

  <div class="left-top">
    <a href="#" class="logo">doc<span>s</span>o</a>
  </div>

  <div class="left-middle">
    <div class="left-headline">
      Seu<br>pro<span class="accent">c</span>esso.<br>No lugar<br>certo.
    </div>
    <div class="left-sub">
      Documente como seu time trabalha, treine quem é novo e garanta que o conhecimento fica — mesmo quando alguém sai.
    </div>
  </div>

  <div class="left-bottom">

  </div>
</div>

<!-- PAINEL DIREITO -->
<div class="right">
  <div class="right-inner">
    <div class="form-eyebrow">— Acesso à plataforma</div>
    <div class="form-titulo">Bom te ver<br>de volta.</div>
    <div class="form-sub">Não tem conta? <a href="#">Criar agora</a></div>

    <div class="campo">
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="seu@email.com.br" autocomplete="email">
    </div>

    <div class="campo">
      <label for="senha">Senha</label>
      <div class="senha-wrap">
        <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password">
        <button class="senha-toggle" onclick="toggleSenha()" type="button" id="toggle-btn">ver</button>
      </div>
    </div>

    <div class="form-opcoes">
      <label class="checkbox-label">
        <input type="checkbox" id="lembrar">
        <div class="checkbox-custom"></div>
        <span class="checkbox-texto">Lembrar de mim</span>
      </label>
      <a href="#" class="esqueci">Esqueci a senha</a>
    </div>

    <button class="btn-entrar" type="button">Entrar</button>

    <div class="divisor">
      <div class="divisor-linha"></div>
      <div class="divisor-texto">ou</div>
      <div class="divisor-linha"></div>
    </div>

    <button class="btn-sso" type="button">
      <div class="sso-icon">
        <div class="sso-dot" style="background:#4285F4;"></div>
        <div class="sso-dot" style="background:#EA4335;"></div>
        <div class="sso-dot" style="background:#34A853;"></div>
        <div class="sso-dot" style="background:#FBBC05;"></div>
      </div>
      Continuar com Google
    </button>

    <div class="form-footer">
      <div class="form-footer-texto">docso.com.br · v1.0</div>
      <div class="status-dot">
        <div class="sd"></div>
        sistemas operacionais
      </div>
    </div>
  </div>
</div>

<script>
  function toggleSenha() {
    const input = document.getElementById('senha');
    const btn = document.getElementById('toggle-btn');
    if (input.type === 'password') {
      input.type = 'text';
      btn.textContent = 'ocultar';
    } else {
      input.type = 'password';
      btn.textContent = 'ver';
    }
  }
</script>

</body>
</html>
